name: Release to PyPI

# Publishes when a version tag (v0.8.0, v1.0.0, ...) is pushed.
# Uses PyPI "trusted publishing" (OIDC) - no API token secrets needed:
# register this repository + workflow at https://pypi.org/manage/account/publishing/

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests first
        run: |
          pip install -e ".[crypto]"
          python -m unittest discover -s tests
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
