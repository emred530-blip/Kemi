# Kemi reverse proxy. Copy to /etc/nginx/sites-available/kemi, replace
# kemi.example.com with your domain, symlink it into sites-enabled, then let
# certbot add TLS:
#
#   sudo ln -s /etc/nginx/sites-available/kemi /etc/nginx/sites-enabled/kemi
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d kemi.example.com
#
# certbot rewrites this file in place: it moves the server block to 443, adds
# the certificate lines and leaves a redirect on 80. Everything below survives.

# Slow down admin-key guessing and stop one client from monopolising the
# portal. Both zones are defined here and applied per-location below.
limit_req_zone $binary_remote_addr zone=kemi_admin:1m rate=12r/m;
limit_req_zone $binary_remote_addr zone=kemi_api:10m rate=60r/m;

upstream kemi_portal  { server 127.0.0.1:8090; keepalive 8; }
upstream kemi_gateway { server 127.0.0.1:11434; keepalive 8; }

server {
    listen 80;
    listen [::]:80;
    server_name kemi.example.com;

    # Answers come from other people's machines, which can take a while on a
    # cold model; the portal itself streams nothing, it polls.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 128k;

    # The portal sets its own Content-Security-Policy and frame rules; nginx
    # only adds what a proxy is in a position to know.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        limit_req zone=kemi_api burst=20 nodelay;
        proxy_pass http://kemi_portal;
    }

    # The operator console. Rate-limited because the key is the only thing
    # standing between the internet and your credit balance.
    #
    # If you administer from a fixed address, uncomment the allow/deny pair —
    # it is worth far more than the rate limit.
    location /admin {
        limit_req zone=kemi_admin burst=5 nodelay;
        # allow 203.0.113.7;   # your address
        # deny  all;
        proxy_pass http://kemi_portal;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://kemi_portal;
    }

    # The OpenAI-compatible API. Streams token by token, so buffering has to
    # be off or clients see nothing until the answer is complete.
    location /v1/ {
        limit_req zone=kemi_api burst=20 nodelay;
        proxy_pass http://kemi_gateway;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }
}
