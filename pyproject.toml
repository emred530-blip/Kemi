[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kemi"
version = "1.2.0"
description = "Kemi: the decentralised peer-to-peer compute sharing network - rent out spare compute, run AI on the fleet"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kemi Project" }]
keywords = ["p2p", "distributed-computing", "compute-sharing", "ai-inference", "dht", "kademlia"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: AsyncIO",
]

[project.urls]
Homepage = "https://github.com/emred530-blip/Kemi"
Repository = "https://github.com/emred530-blip/Kemi"
Changelog = "https://github.com/emred530-blip/Kemi/blob/main/CHANGELOG.md"

[project.scripts]
kemi = "kemi.cli:main"

[project.optional-dependencies]
# Fast Ed25519 via libsodium; without it Kemi falls back to a (slow but
# compatible) pure-Python implementation.
crypto = ["pynacl"]
ai = ["transformers", "torch"]

[tool.setuptools.packages.find]
include = ["kemi*"]
