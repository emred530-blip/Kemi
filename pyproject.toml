[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kemi"
version = "0.7.0"
description = "Kemi: merkeziyetsiz P2P islem gucu paylasim agi (decentralised peer-to-peer compute sharing network)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kemi Project" }]
keywords = ["p2p", "distributed-computing", "compute-sharing", "ai-inference", "dht", "kademlia"]

[project.scripts]
kemi = "kemi.cli:main"

[project.optional-dependencies]
# Fast Ed25519 via libsodium; without it Kemi falls back to a (slow but
# compatible) pure-Python implementation.
crypto = ["pynacl"]
ai = ["transformers", "torch"]

[tool.setuptools.packages.find]
include = ["kemi*"]
